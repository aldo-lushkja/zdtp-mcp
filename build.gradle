plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.4.1'
    id 'org.graalvm.buildtools.native' version '0.10.4'
}

group = 'com.ibm.mcp.zdtp'
version = '1.2.0'

application {
    mainClass = 'com.ibm.mcp.zdtp.ZdtpMcpApplication'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.3'
    implementation 'org.commonmark:commonmark:0.21.0'

    testImplementation platform('org.junit:junit-bom:5.12.2')
    testImplementation 'org.junit.jupiter:junit-jupiter:5.12.2'
    testImplementation 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.mockito:mockito-core:5.23.0'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
    testImplementation 'org.assertj:assertj-core:3.27.4'
}

tasks.withType(Test) {
    useJUnitPlatform()
    jvmArgs(
        '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
        '--add-opens=java.base/java.util=ALL-UNNAMED',
        '-Dnet.bytebuddy.experimental=true'
    )
}

tasks.withType(JavaCompile) {
    options.compilerArgs << '-parameters'
}

processResources {
    // Inject project version into server.properties at build time
    filesMatching('server.properties') {
        expand(version: version)
    }
    // Bundle CHANGELOG.md inside the JAR so the server_changelog MCP tool can serve it
    from(rootDir) {
        include 'CHANGELOG.md'
    }
}

tasks.named('jar') {
    manifest {
        attributes 'Main-Class': 'com.ibm.mcp.zdtp.ZdtpMcpApplication'
    }
}

tasks.named('shadowJar') {
    archiveClassifier.set('all')
    mergeServiceFiles()
}

// Fix for Shadow JAR and application plugin distribution task conflicts
// These tasks use the output of shadowJar (the jar with no classifier)
// without an explicit dependency, causing build failures in newer Gradle versions.
def shadowTasks = ['distZip', 'distTar', 'startScripts',
                   'shadowDistZip', 'shadowDistTar', 'startShadowScripts']
shadowTasks.each { taskName ->
    tasks.findByName(taskName)?.dependsOn('shadowJar')
}

// =============================================================================
// GraalVM Native Build
// =============================================================================
graalvmNative {
    binaries {
        main {
            imageName = 'zdtp-mcp'
            mainClass = 'com.ibm.mcp.zdtp.ZdtpMcpApplication'
            buildArgs.add('--no-fallback')
            buildArgs.add('--report-unsupported-elements-at-runtime')
        }
    }
}

// =============================================================================
// jpackage (Native Installers)
// =============================================================================
tasks.register('jpackage') {
    dependsOn('jar')
    group = 'distribution'
    description = 'Create native installer using jpackage'

    doLast {
        exec {
            workingDir = layout.buildDirectory.dir('jpackage')
            commandLine = [
                'jpackage',
                '--input', 'build/libs',
                '--main-jar', "zdtp-mcp-${version}-all.jar",
                '--name', 'zdtp-mcp',
                '--app-version', version,
                '--vendor', 'IBM MCP',
                '--description', 'Targetprocess MCP Server',
                '--type', 'dir'
            ]
        }
    }
}
