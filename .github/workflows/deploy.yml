name: CI/CD Pipeline (Git Flow)

on:
  push:
    branches: [ main, develop, 'release/**', 'feature/**', 'bugfix/**', 'hotfix/**' ]
    tags: [ 'v*' ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # 1. Metadata: Shared information
  metadata:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      is_release: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
      is_pre_release: ${{ startsWith(github.ref, 'refs/heads/release/') || github.ref == 'refs/heads/develop' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Get Version
        id: get_version
        run: |
          VERSION=$(./gradlew properties -q | grep "^version:" | awk '{print $2}')
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

  # 2. Continuous Integration: Test & Build (Runs for every push)
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Run Tests
        run: ./gradlew test
      - name: Build Shadow JAR
        run: ./gradlew shadowJar
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fat-jar
          path: build/libs/*-all.jar

  # 3. GitHub Release: Only for Main/Tags
  publish-release:
    needs: [metadata, ci]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: fat-jar
          path: build/libs
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/zdtp-mcp-${{ needs.metadata.outputs.version }}-all.jar
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', needs.metadata.outputs.version) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && format('Release {0}', github.ref_name) || format('Release v{0}', needs.metadata.outputs.version) }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 4. Docker Registry: Strategic multi-architecture tagging (JVM + Native)
  publish-docker:
    needs: [metadata, ci]
    # Deploy for develop, release branches, main, or tags
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # --- 4A. JVM Multi-Arch Image (linux/amd64, linux/arm64) ---
      - name: Extract Docker metadata (JVM)
        id: meta_jvm
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.metadata.outputs.version }},enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=release,enable=${{ startsWith(github.ref, 'refs/heads/release/') }}
      - name: Build and push (JVM Image - Multi-Arch)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: jvm
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_jvm.outputs.tags }}
          labels: ${{ steps.meta_jvm.outputs.labels }}

      # --- 4B. Native GraalVM Image ---
      - name: Extract Docker metadata (Native)
        id: meta_native
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ needs.metadata.outputs.version }}-native,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest-native,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=develop-native,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=release-native,enable=${{ startsWith(github.ref, 'refs/heads/release/') }}
      - name: Build and push (Native Image)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: native
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta_native.outputs.tags }}
          labels: ${{ steps.meta_native.outputs.labels }}

